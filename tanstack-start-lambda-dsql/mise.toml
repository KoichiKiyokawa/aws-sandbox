[tools]
node = "22.23.2"
pnpm = "12.5.1"
pulumi = "3.263.0"
awscli = "2.36.49"

# 日常操作は mise run <タスク名>。一覧は mise tasks。
# dir はこのファイルを基準に固定し、app/ や pulumi/ からも同じ場所で実行する。
# mise run 自体が上記ツールを適用するため、run 内の mise exec は不要。

# 依存関係はロックファイル通りに導入する。初回と依存更新の取り込み後に実行。
[tasks."app:install"]
description = "アプリの依存関係をインストール"
dir = "{{config_root}}/app"
run = "pnpm install --frozen-lockfile"

# 初回は app:install → db:setup → app:dev の順に実行する。
[tasks."app:dev"]
description = "開発サーバーを起動（localhost:3000）"
dir = "{{config_root}}/app"
run = "pnpm dev"

[tasks."app:check"]
description = "Lint・フォーマット・型チェック・DBテスト"
dir = "{{config_root}}/app"
run = "pnpm check"

# Pulumi の preview/up も ZIP 元の .output/server を必要とする。
# インストール → Lambda用ビルド → ハンドラー検証を直列実行する。
[tasks."app:build"]
description = "Lambda向けビルドとハンドラー検証"
dir = "{{config_root}}/app"
run = ["pnpm install --frozen-lockfile", "pnpm build:lambda", "pnpm test:lambda"]

# 通常のNodeサーバー向けビルド。Lambda用とは出力先を共有するため同時実行しない。
[tasks."app:build:node"]
description = "Nodeサーバー向けビルド"
dir = "{{config_root}}/app"
run = "pnpm build"

# 初回は mise exec -- pnpm --dir app exec playwright install chromium でブラウザーを導入。
[tasks."app:e2e"]
description = "ChromiumでE2Eテスト"
dir = "{{config_root}}/app"
run = "pnpm test:e2e"

# app/.env または環境変数で指定したDBが対象。未指定ならローカルPGlite。
# DSQLでは対象のDSQL_HOSTとAWS認証が必要。既存テーブルのスキーマ変更は行わない。
[tasks."db:setup"]
description = "接続先DBに初期テーブルを作成"
dir = "{{config_root}}/app"
run = "pnpm db:setup"

# Pulumiの依存関係を導入。package.jsonに操作コマンドは重複定義しない。
[tasks."infra:install"]
description = "Pulumiの依存関係をインストール"
dir = "{{config_root}}/pulumi"
run = "pnpm install --frozen-lockfile"

# 初回構築: infra:install → backend/stack選択 → app:build → infra:preview → infra:up。
# backend/stackの初期化と既存Terraform環境の引継ぎはpulumi/README.mdを参照。
# Lambdaコード・静的ファイルもPulumiが管理する。preview/up前にapp:buildを実行する。
[tasks."infra:preview"]
description = "インフラの変更内容を確認"
dir = "{{config_root}}/pulumi"
run = "pulumi preview --refresh"

[tasks."infra:up"]
description = "インフラの変更を適用"
raw = true
dir = "{{config_root}}/pulumi"
run = "pulumi up --refresh"

# AWS認証・Pulumiログイン不要。AWSリソースはモックし、構成と移行処理を検証する。
[tasks."infra:check"]
description = "Pulumiの型チェック・構成・移行テスト"
dir = "{{config_root}}/pulumi"
run = ["pnpm exec tsc --noEmit", "node --import tsx --test tests/*.test.ts tests/*.test.mjs"]

# ビルド・ハンドラー検証に成功してから、インフラとアプリを一括更新する。
# Pulumiが新アセットの配置後にLambdaを更新し、旧アセットはS3に残す。
# 初回のbackend/stack選択と既存環境のimportはpulumi/README.mdを参照。
[tasks."app:deploy"]
description = "ビルド・検証後、Pulumiでインフラとアプリを更新"
raw = true
depends = ["infra:install", "app:build"]
dir = "{{config_root}}/pulumi"
run = "pulumi up --refresh"
