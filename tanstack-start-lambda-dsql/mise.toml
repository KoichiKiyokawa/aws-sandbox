[tools]
node = "22.23.2"
pnpm = "12.5.1"
terraform = "1.16.3"
awscli = "2.36.49"

# 日常操作は mise run <タスク名>。一覧は mise tasks。
# dir はこのファイルを基準に固定し、app/ や terraform/ からも同じ場所で実行する。
# mise run 自体が上記ツールを適用するため、run 内の mise exec は不要。

# 依存関係はロックファイル通りに導入する。初回と依存更新の取り込み後に実行。
[tasks."app:install"]
description = "アプリの依存関係をインストール"
dir = "{{config_root}}/app"
run = "pnpm install --frozen-lockfile"

# 初回は app:install → db:setup → app:dev の順に実行する。
[tasks."app:dev"]
description = "開発サーバーを起動（localhost:3000）"
dir = "{{config_root}}/app"
run = "pnpm dev"

[tasks."app:check"]
description = "Lint・フォーマット・型チェック・DBテスト"
dir = "{{config_root}}/app"
run = "pnpm check"

# Terraform の plan/apply も ZIP 元の .output/server を必要とする。
# インストール → Lambda用ビルド → ハンドラー検証を直列実行する。
[tasks."app:build"]
description = "Lambda向けビルドとハンドラー検証"
dir = "{{config_root}}/app"
run = ["pnpm install --frozen-lockfile", "pnpm build:lambda", "pnpm test:lambda"]

# 通常のNodeサーバー向けビルド。Lambda用とは出力先を共有するため同時実行しない。
[tasks."app:build:node"]
description = "Nodeサーバー向けビルド"
dir = "{{config_root}}/app"
run = "pnpm build"

# 初回は mise exec -- pnpm --dir app exec playwright install chromium でブラウザーを導入。
[tasks."app:e2e"]
description = "ChromiumでE2Eテスト"
dir = "{{config_root}}/app"
run = "pnpm test:e2e"

# app/.env または環境変数で指定したDBが対象。未指定ならローカルPGlite。
# DSQLでは対象のDSQL_HOSTとAWS認証が必要。既存テーブルのスキーマ変更は行わない。
[tasks."db:setup"]
description = "接続先DBに初期テーブルを作成"
dir = "{{config_root}}/app"
run = "pnpm db:setup"

[tasks."tf:init"]
description = "Terraformのprovider・backendを初期化"
dir = "{{config_root}}/terraform"
run = "terraform init"

# 初回構築: app:build → tf:init → tf:plan → tf:apply → app:deploy。
# plan/apply 前にAWS認証を設定する。tf:apply はTerraformの確認プロンプトを維持する。
[tasks."tf:plan"]
description = "インフラの変更内容を確認"
dir = "{{config_root}}/terraform"
run = "terraform plan"

[tasks."tf:apply"]
description = "インフラの変更を適用"
raw = true
dir = "{{config_root}}/terraform"
run = "terraform apply"

# tf:init と app:build 後に実行。test はモックproviderを使用する。
[tasks."tf:check"]
description = "Terraformの書式・構文・モックテスト"
dir = "{{config_root}}/terraform"
run = ["terraform fmt -check", "terraform validate", "terraform test"]

# tf:apply 済みのstateとAWS認証が前提。DB初期化は db:setup で別途実施する。
# ビルド検証に成功した後だけアップロードする。Terraformの適用は行わない。
[tasks."app:deploy"]
description = "ビルド・検証後、S3アセットとLambdaコードを更新"
dir = "{{config_root}}"
run = '''
#!/usr/bin/env bash
set -euo pipefail
region=$(terraform -chdir=terraform output -raw aws_region)
bucket=$(terraform -chdir=terraform output -raw assets_bucket)
function_name=$(terraform -chdir=terraform output -raw lambda_function_name)
mise run app:build
# Lambdaを切り替える前にアセットを配置。開いたままの旧ページ用に旧ファイルも保持する。
aws s3 sync app/.output/public/assets/ "s3://$bucket/assets/" --region "$region" --cache-control 'public,max-age=31536000,immutable'
# ZIPは一時ディレクトリに作成し、失敗時も終了時に削除する。
archive=$(mktemp -d)
trap 'rm -rf "$archive"' EXIT
(cd app/.output/server && zip -qr "$archive/lambda.zip" .)
aws lambda update-function-code --region "$region" --function-name "$function_name" --zip-file "fileb://$archive/lambda.zip" > /dev/null
# 更新完了を待ってから公開URLを表示する。
aws lambda wait function-updated-v2 --region "$region" --function-name "$function_name"
terraform -chdir=terraform output -raw app_url
'''
