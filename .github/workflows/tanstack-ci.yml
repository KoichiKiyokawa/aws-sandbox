name: TanStack CI

on:
  pull_request:
    paths:
      - 'tanstack-start-lambda-dsql/**'
      - '!tanstack-start-lambda-dsql/**/*.md'
      - '.github/workflows/tanstack-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tanstack-start-lambda-dsql/**'
      - '!tanstack-start-lambda-dsql/**/*.md'
      - '.github/workflows/tanstack-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanstack-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node checks and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tanstack-start-lambda-dsql/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.9.11'
          working_directory: tanstack-start-lambda-dsql
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tanstack-start-lambda-dsql/mise.toml', 'tanstack-start-lambda-dsql/app/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: mise exec -- pnpm install --frozen-lockfile
      - name: Lint
        run: mise exec -- pnpm lint
      - name: Check formatting
        run: |
          if ! mise exec -- pnpm format:check; then
            mise exec -- pnpm exec oxfmt --write scripts/test-lambda.mjs
            git diff
            exit 1
          fi
      - name: Check types
        run: mise exec -- pnpm typecheck
      - name: Unit and database tests
        run: mise exec -- pnpm test
      # ubuntu-24.04 already provides Chromium's shared libraries.
      # The default headless project only needs the shell, not the full browser.
      - name: Install Chromium headless shell
        run: mise exec -- pnpm exec playwright install --only-shell chromium
      # Playwright builds and starts the Node server with an isolated PGlite DB.
      - name: Node build and browser tests
        run: mise exec -- pnpm test:e2e

  lambda-terraform:
    name: Lambda and Terraform tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tanstack-start-lambda-dsql/terraform
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        with:
          version: '2026.9.11'
          working_directory: tanstack-start-lambda-dsql
      - name: Locate pnpm store
        id: pnpm-store
        run: echo "path=$(mise exec -- pnpm --dir ../app store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tanstack-start-lambda-dsql/mise.toml', 'tanstack-start-lambda-dsql/app/pnpm-lock.yaml') }}
      - name: Install dependencies
        run: mise exec -- pnpm --dir ../app install --frozen-lockfile
      # The real archive provider packages this output during terraform test.
      - name: Build Lambda
        run: mise exec -- pnpm --dir ../app build:lambda
      - name: Test Lambda handler
        run: mise exec -- pnpm --dir ../app test:lambda
      - name: Check Terraform formatting
        run: mise exec -- terraform fmt -check -recursive
      - name: Initialize Terraform
        run: mise exec -- terraform init -backend=false -lockfile=readonly -input=false
      - name: Validate Terraform
        run: mise exec -- terraform validate
      # routing.tftest.hcl mocks AWS; no AWS credentials or deployment are needed.
      - name: Test Terraform
        run: mise exec -- terraform test
