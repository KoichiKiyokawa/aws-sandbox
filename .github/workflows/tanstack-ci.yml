name: TanStack CI

on:
  pull_request:
    paths:
      - 'tanstack-start-lambda-dsql/**'
      - '.github/workflows/tanstack-ci.yml'
  push:
    branches: [main]
    paths:
      - 'tanstack-start-lambda-dsql/**'
      - '.github/workflows/tanstack-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tanstack-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  node:
    name: Node checks and E2E
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tanstack-start-lambda-dsql/app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: tanstack-start-lambda-dsql/app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: tanstack-start-lambda-dsql/app/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Check formatting
        run: pnpm format:check
      - name: Check types
        run: pnpm typecheck
      - name: Unit and database tests
        run: pnpm test
      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
      # Playwright builds and starts the Node server with an isolated PGlite DB.
      - name: Node build and browser tests
        run: pnpm test:e2e

  lambda-terraform:
    name: Lambda and Terraform tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tanstack-start-lambda-dsql/terraform
    env:
      TF_IN_AUTOMATION: 'true'
      TF_INPUT: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: tanstack-start-lambda-dsql/app/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: tanstack-start-lambda-dsql/app/pnpm-lock.yaml
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with:
          terraform_version: '1.14.0'
          terraform_wrapper: false
      - name: Install dependencies
        run: pnpm --dir ../app install --frozen-lockfile
      # The real archive provider packages this output during terraform test.
      - name: Build Lambda
        run: pnpm --dir ../app build:lambda
      - name: Test Lambda handler
        run: pnpm --dir ../app test:lambda
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive
      - name: Initialize Terraform
        run: terraform init -backend=false -lockfile=readonly -input=false
      - name: Validate Terraform
        run: terraform validate
      # routing.tftest.hcl mocks AWS; no AWS credentials or deployment are needed.
      - name: Test Terraform
        run: terraform test
